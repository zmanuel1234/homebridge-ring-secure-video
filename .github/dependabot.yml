# Weekly pull requests for outdated or vulnerable dependencies and GitHub Actions. Each one runs
# CI and still needs a review before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
