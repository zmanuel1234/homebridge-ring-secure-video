# Shared by homebridge-brother-printer, homebridge-comelit-doorbell, homebridge-ir-patio-heater,
# homebridge-lg-thinq-connect, homebridge-ring-secure-video and wyze-robovac-matterbridge: the same
# file in all six. System packages a repository's tests need (ffmpeg for the camera plugins) are
# listed in its .github/apt-packages, one per line, and installed only where that file exists. What a
# repository checks before a release is its package.json's "release:check" script (its CI
# checks, "verify", and anything only a release needs).
#
# Publishing a GitHub release (tag v + the version in package.json) publishes that version to npm.
# A release published with no notes gets this version's CHANGELOG section ("## 1.2.0 - date") as
# its notes, so they needn't be pasted. A stable version older than npm's "latest" (a fix for an
# older major, or releases published out of order) never moves "latest" back: it gets "previous". "Run workflow" with a release's tag publishes a release that
# already exists (one created before this workflow ran, or whose run failed).
#
# "build" checks and packs the release's code with no access to npm or to the release. "attach"
# adds the package and its checksum to the release, and "publish" publishes that same package
# with npm's trusted publishing: no token is stored anywhere, npm checks this workflow's GitHub
# identity. Register the repository and publish.yml as the package's trusted publisher on
# npmjs.com (package -> Settings -> Trusted publishing).
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release's tag to publish (e.g. v1.2.0)
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # to fill in the release's notes; this job runs no repository or npm code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Notes from the CHANGELOG, when the release has none
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)" \
            || { echo "::error::There is no release $TAG: create and publish it on GitHub first."; exit 1; }
          if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then echo "The release has notes."; exit 0; fi
          version="${TAG#v}"
          # The lines after "## <version>" up to the next "## "
          awk -v v="$version" '
            /^## / { if (found) exit; split($0, a, " "); if (a[2] == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "::error::The release has no notes, and CHANGELOG.md has no \"## $version\" section to take them from."; exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          echo "Notes added from CHANGELOG.md:"; cat notes.md

  build:
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,body)" \
            || { echo "::error::There is no release $TAG: create and publish it on GitHub first."; exit 1; }
          field() { printf '%s' "$json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[process.argv[1]]))" "$1"; }
          if [ "$(field isDraft)" = true ]; then
            echo "::error::Release $TAG is a draft: publish it on GitHub first."; exit 1
          fi
          if [ -z "$(field body | tr -d '[:space:]')" ]; then
            echo "::error::Release $TAG has no release notes (a Homebridge rule). Add the CHANGELOG section for this version, then run this again."; exit 1
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" != true ]; then
            echo "::error::Issues are disabled on this repository (a Homebridge rule). Enable them in the repository settings."; exit 1
          fi
          { echo "tag=$TAG"; echo "prerelease=$(field isPrerelease)"; echo "version=${TAG#v}"; } >> "$GITHUB_OUTPUT"
      - name: Check the tag and the pre-release box match package.json
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: .github/scripts/check-release-tag.sh "$TAG" "$PRERELEASE"
      - name: Downloaded system packages from earlier runs (cache)
        if: hashFiles('.github/apt-packages') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives/*.deb
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt-packages') }}-${{ github.run_id }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt-packages') }}-
      - name: System packages this repository's tests need (.github/apt-packages)
        id: apt
        if: hashFiles('.github/apt-packages') != ''
        # A slow mirror can take minutes when nothing is cached (.github/scripts/apt-install.sh)
        timeout-minutes: 25
        run: .github/scripts/apt-install.sh
      - run: npm ci
      - name: This repository's checks (package.json "release:check")
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REQUIRE_FFMPEG: '1'   # tests that use ffmpeg fail, not skip, without it; others ignore it
        run: npm run release:check
      - name: Pack
        run: npm pack --ignore-scripts
      - name: Checksum
        run: sha256sum ./*.tgz | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            ./*.tgz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  attach:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # to add files to the release; this job runs no repository or npm code
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Add the package and its checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          sha256sum --check --strict SHA256SUMS
          gh release upload "$TAG" ./*.tgz SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [build, attach]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # npm trusted publishing
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm with trusted publishing (11.5.1 or later), at an exact version
        run: npm install -g --ignore-scripts npm@11.21.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Publish the package "build" checked
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha256sum --check --strict SHA256SUMS
          # 1.3.0-dev-1: "dev" (Matterbridge's UI offers a plugin's dev version); any other
          # pre-release (2.6.0-beta.1): "beta"; a stable version: "latest".
          case "$VERSION" in
            *-dev-*|*-git-*) dist=dev ;;
            *-*)             dist=beta ;;
            *)               dist=latest ;;
          esac
          # Never move "latest" back to an older version
          if [ "$dist" = latest ]; then
            name="$(tar -xOzf ./*.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')"
            current="$(npm view "$name" dist-tags.latest 2>/dev/null || true)"
            if [ -n "$current" ] && node -e '
              const n = (v) => v.split(".").map(Number);
              const [a, b] = [n(process.argv[1]), n(process.argv[2])];
              for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) process.exit(a[i] < b[i] ? 0 : 1); }
              process.exit(1);' "$VERSION" "$current"; then
              echo "npm's latest is $current, newer than $VERSION: publishing $VERSION as \"previous\"."
              dist=previous
            fi
          fi
          npm publish ./*.tgz --access public --tag "$dist"
